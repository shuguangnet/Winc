# 依赖健康检查：许可证合规、漏洞通告与重复依赖。CI 每次运行（见 ci.yml 的 deny 任务），
# 本地用 `cargo deny check` 复现。schema 参照 cargo-deny 0.21。
#
# 许可证只放行对本项目（Apache-2.0）友好、可再分发的常见宽松许可证；出现其他许可证（或明确
# 禁用的）时构建失败，需要人工评估后再加进 allow。

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-3-Clause",
    "BSD-2-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "BSL-1.0",
]

[advisories]
version = 2
# 有已知漏洞通告的依赖默认（vulnerability）就是失败；被撤回（yanked）的版本同样失败。
# 已弃维（unmaintained）的上游（ttf-parser、zbus 系）只提示，不阻塞发布。
unmaintained = "none"
yanked = "deny"

[bans]
# 同一 crate 的多个版本先警告：编辑器生态里常见，收敛后再收紧为 deny。
multiple-versions = "warn"
